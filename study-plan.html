<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30-Day Payroll Roadmap</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", sans-serif;
            background: #F6DAC0;
            color: #213843;
        }

        nav {
            background: #213843;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 8%;
        }

        .logo {
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .menu a {
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 999px;
            margin-left: 10px;
        }

        .menu a:hover {
            background: white;
            color: #213843;
        }

        .hero {
            background: linear-gradient(135deg, #213843, #46B0BB);
            text-align: center;
            color: white;
            padding: 100px 20px;
        }

        .hero h1 {
            font-size: 3.5rem;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 60px 20px;
        }

        .week {
            background: white;
            padding: 35px;
            border-radius: 35px;
            margin-bottom: 25px;
        }
