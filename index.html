<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payroll Compliance Learning Hub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", sans-serif;
            background: #F6DAC0;
            color: #213843;
        }

        /* HERO */

        .hero {
            min-height: 100vh;

            background: linear-gradient(
                135deg,
                #213843,
                #46B0BB
            );

            color: white;
        }

        /* NAVIGATION */

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 30px 8%;
        }

        .logo {
            text-decoration: none;
            color: white;

            font-size: 1.8rem;
            font-weight: 700;
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
        }

        .nav-buttons a {
            text-decoration: none;
            font-weight: 600;

            padding: 15px 34px;

            border-radius: 999px;

            transition: all 0.3s ease;
        }

        .about-btn {
            background: #FEAF76;
            color: #213843;
        }

        .study-btn {
            background: white;
            color: #213843;
        }

        .nav-buttons a:hover {
            transform: translateY(-3px);

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.15);
        }

        /* HERO CONTENT */

        .hero-content {
            width: 85%;
            max-width: 1200px;

            margin: auto;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding-top: 80px;
        }

        .left {
            width: 50%;
        }

        .left h1 {
            font-size: 4.2rem;
            line-height: 1.1;
        }

        .highlight {
            color: #FEAF76;
        }

        .left p {
            margin-top: 25px;

            max-width: 500px;

            line-height: 1.8;

            font-size: 1.1rem;
        }

        .journey-btn {
            display: inline-block;

            margin-top: 35px;

            background: #FEAF76;
            color: #213843;

            text-decoration: none;
            font-weight: 700;

            padding: 18px 38px;

            border-radius: 999px;

            transition: all .3s ease;
        }

        .journey-btn:hover {
            background: white;

            transform: translateY(-3px);
        }

        /* RIGHT ILLUSTRATION */

        .right {
            width: 40%;

            display: flex;
            justify-content: center;
        }

        .circle {

            width: 350px;
            height: 350px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #DA6D5B,
                    #FEAF76
                );

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 120px;

            box-shadow:
                0 20px 40px rgba(0, 0, 0, 0.20);
        }

        /* CONTENT SECTION */

        .content {
            width: 85%;
            max-width: 1100px;

            margin: auto;

            padding: 80px 0;
        }

        .content h2 {
            font-size: 2.5rem;

            margin-bottom: 20px;
        }

        .content p {
            line-height: 1.9;
        }

        /* PILLS */

        .topic-list {
            margin-top: 35px;

            display: flex;
            flex-wrap: wrap;

            gap: 15px;
        }

        .topic {
            background: white;

            padding: 14px 24px;

            border-radius: 999px;

            font-weight: 600;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.08);
        }

        /* FOOTER */

        footer {
            background: #213843;

            color: white;

            text-align: center;

            padding: 25px;
        }

        /* MOBILE */

        @media (max-width: 900px) {

            nav {
                flex-direction: column;
                gap: 20px;
            }

            .hero-content {
                flex-direction: column;
                text-align: center;
            }

            .left,
            .right {
                width: 100%;
            }

            .left h1 {
                font-size: 3rem;
            }

            .left p {
                margin-left: auto;
                margin-right: auto
